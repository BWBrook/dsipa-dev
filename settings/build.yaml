default_profile: draft

profiles:
  draft:
    description: DSIPA manuscript working draft built through the local makedoc checkout.
    manuscript_sources:
      - ../manuscript/text/manuscript_draft.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/supplementary_tables.md
      - ../manuscript/text/references.md
      - ../manuscript/text/figures.md
      - ../manuscript/text/supplementary_figures.md
    lint_sources:
      - ../manuscript/text/manuscript_draft.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/supplementary_tables.md
      - ../manuscript/text/figures.md
      - ../manuscript/text/supplementary_figures.md
    author_metadata: ../manuscript/authors.yaml
    bibliography: ../references/refs.yaml
    csl: ../csl/cambridge-university-press-author-date-cambridge-a.csl
    journal: DSIPA working manuscript
    csl_search_dirs:
      - ../csl
    output_dir: ../build/draft
    output_stem: dsipa_draft
    page_numbers: lower_right
    line_spacing: 1.5
    line_numbering: continuous
    references_new_page: true
    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures
    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 2.5
      bottom: 2.0
      left: 2.5

  submission:
    description: RSEC Original Research main-text-only submission build.
    manuscript_sources:
      - ../manuscript/text/manuscript_draft.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/references.md
      - ../manuscript/text/figures.md
    lint_sources:
      - ../manuscript/text/manuscript_draft.md
      - ../manuscript/text/tables.md
      - ../manuscript/text/figures.md
    author_metadata: ../manuscript/submission/rsec/submission_authors.yaml
    bibliography: ../references/refs.yaml
    csl: ../csl/cambridge-university-press-author-date-cambridge-a.csl
    journal: Remote Sensing in Ecology and Conservation
    csl_search_dirs:
      - ../csl
    output_dir: ../build/submission
    output_stem: dsipa_rsec_main
    page_numbers: lower_right
    line_spacing: 2
    line_numbering: continuous
    references_new_page: true
    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures
    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 2.5
      bottom: 2.0
      left: 2.5

  supplementary:
    description: RSEC Supporting Information PDF build; generated DOCX is diagnostic only.
    manuscript_sources:
      - ../manuscript/submission/rsec/supplementary_frontmatter.md
      - ../manuscript/text/supplementary_tables.md
      - ../manuscript/submission/rsec/supplementary_table_end.md
      - ../manuscript/text/supplementary_figures.md
    lint_sources:
      - ../manuscript/submission/rsec/supplementary_frontmatter.md
      - ../manuscript/text/supplementary_tables.md
      - ../manuscript/submission/rsec/supplementary_table_end.md
      - ../manuscript/text/supplementary_figures.md
    bibliography: ../references/refs.yaml
    csl: ../csl/cambridge-university-press-author-date-cambridge-a.csl
    journal: Remote Sensing in Ecology and Conservation
    csl_search_dirs:
      - ../csl
    output_dir: ../build/supplementary
    output_stem: dsipa_rsec_supplementary
    page_numbers: lower_right
    line_spacing: 2
    line_numbering: continuous
    references_new_page: false
    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures
    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      right: 0.75
      bottom: 2.0
      left: 0.75

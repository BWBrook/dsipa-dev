[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsipa-nbs"
version = "0.1.0"
description = "Dark-Sky Integrity of Protected Areas & Nocturnal Biodiversity Signals (Australia)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DSIPA-NBS contributors" }
]
dependencies = [
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyproj>=3.6",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.0"
]

[project.scripts]
dsipa-run = "dsipa.run:main"

[tool.setuptools]
package-dir = {"" = "src/python"}
packages = ["dsipa"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests/python"]
pythonpath = ["src/python"]
